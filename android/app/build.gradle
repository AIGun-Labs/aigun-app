plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.aigun"

    compileSdk = 36  // 升级到 36 以兼容 background_downloader
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        languageVersion = '2.0'
        apiVersion = '2.0'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.aigun"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion  // 升级到 23 以兼容 firebase_analytics
        targetSdkVersion = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    productFlavors {
        staging {
            applicationId = "com.aigun.staging"
            resValue "string", "app_name", "AIGun内测版"
        }
        production {
            applicationId = "com.aigun"
            resValue "string", "app_name", "AIGun"
        }
    }


    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : file('../key.jks')
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // 启用混淆
            minifyEnabled true

            // 启用资源压缩
            shrinkResources true

            // 配置APP签名
            signingConfig signingConfigs.release
            
            // 指定 ProGuard 规则文件
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                         'proguard-rules.pro'

        }
    }
}

dependencies {
    // 添加 Play Core 依赖
    implementation 'com.google.android.play:core:1.10.3'
    implementation 'com.google.android.play:core-ktx:1.8.1'

    // 显式指定 Sentry SDK 版本以解决 Kotlin 2.0 兼容性问题
    implementation 'io.sentry:sentry-android:7.18.0'
}

flutter {
    source = "../.."
}
