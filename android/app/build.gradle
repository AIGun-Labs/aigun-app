plugins {
    id "com.android.application"
    // 如果以后需要使用 Firebase，取消下面的注释并添加 google-services 插件
    // id 'com.google.gms.google-services'
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.aigun"

    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.aigun.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdkVersion = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions "environment"

    productFlavors {
        play {
            dimension "environment"
            applicationId = "com.aigun.app.play"
            resValue "string", "app_name", "AIGun"
        }
        staging {
            dimension "environment"
            applicationId = "com.aigun.staging"
            resValue "string", "app_name", "AIGun内测版"
        }
        production {
            dimension "environment"
            applicationId = "com.aigun"
            resValue "string", "app_name", "AIGun"
        }
    }


    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : file('../key.jks')
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // 启用混淆
            minifyEnabled true

            // 启用资源压缩
            shrinkResources true

            // 配置APP签名
            signingConfig signingConfigs.release

            // 指定 ProGuard 规则文件
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                         'proguard-rules.pro'
            
            // 配置原生库符号剥离 - 解决 "failed to strip debug symbols" 错误
            // 使用 SYMBOL_TABLE 可以在保持较小体积的同时避免构建错误
            ndk {
                debugSymbolLevel = 'SYMBOL_TABLE'
            }
        }
    }
}

flutter {
    source = "../.."
}