name: Build and Release (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment (staging/production)"
        required: true
        type: string
      version:
        description: "Version number (e.g., 1.0.0)"
        required: false
        type: string
      target:
        description: "Entry file path(like lib/main.dart)"
        required: true
        type: string
      flavor:
        description: "Build flavor"
        required: true
        type: string
      enable_obfuscate:
        description: "Enable code obfuscation"
        required: false
        type: boolean
        default: false
      s3_prefix:
        description: "S3 prefix path"
        required: false
        type: string
      qiniu_prefix:
        description: "Qiniu prefix path"
        required: false
        type: string
      release_suffix:
        description: "Release tag suffix (e.g., -test)"
        required: false
        type: string
        default: ""
      enable_ios_build:
        description: "Enable iOS build"
        required: false
        type: boolean
        default: false
env:
  FLUTTER_VERSION: "3.38.5"
  JAVA_VERSION: "17"
  APP_NAME: "aigun"
permissions:
  contents: write
  packages: write

jobs:
  # ====================================
  # ====================================
  version_info:
    name: Extract Version Info
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      changelog_zh: ${{ steps.changelog.outputs.changelog_zh }}
      changelog_en: ${{ steps.changelog.outputs.changelog_en }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get version info
        id: version
        run: |
          VERSION_LINE=$(grep -oP '(?<=version: )[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' pubspec.yaml)

          if [ -z "$VERSION_LINE" ]; then
            echo "❌  pubspec.yaml "
            exit 1
          fi
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION_LINE" | cut -d'+' -f2)

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Version: v$VERSION_NAME (build $VERSION_CODE)"
      - name: Extract changelog
        id: changelog
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          chmod +x .github/scripts/extract-changelog.sh

          CHANGELOG_ZH=$(.github/scripts/extract-changelog.sh "$VERSION_NAME" "zh")
          CHANGELOG_EN=$(.github/scripts/extract-changelog.sh "$VERSION_NAME" "en")

          echo "changelog_zh<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_ZH" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "changelog_en<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_EN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "✅ Changelog extracted"

  # ====================================
  # ====================================
  build_android:
    name: Build Android APK
    needs: version_info
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.build.outputs.apk_name }}
      apk_path: ${{ steps.build.outputs.apk_path }}
      s3_apk_sha: ${{ steps.upload_s3.outputs.apk_sha }}
      s3_apk_url: ${{ steps.upload_s3.outputs.apk_url }}
      s3_sha256_url: ${{ steps.upload_s3.outputs.sha256_url }}
      s3_latest_json_url: ${{ steps.upload_s3.outputs.latest_json_url }}
      qiniu_apk_sha: ${{ steps.upload_qiniu.outputs.apk_sha }}
      qiniu_apk_url: ${{ steps.upload_qiniu.outputs.apk_url }}
      qiniu_sha256_url: ${{ steps.upload_qiniu.outputs.sha256_url }}
      qiniu_latest_json_url: ${{ steps.upload_qiniu.outputs.latest_json_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Setup Flutter build environment
        uses: ./.github/actions/setup-flutter-build
        with:
          base-api-url: ${{ vars.API_URL_PROD }}
          base-ws-url: ${{ vars.WS_URL_PROD }}
          base-cdn-url: ${{ vars.CDN_URL_PROD }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          candlestick-url: ${{ vars.CANDLESTICK_URL }}
          base-test-api-url: ${{ vars.API_URL_TEST }}
          base-test-ws-url: ${{ vars.WS_URL_TEST }}
      - name: Install dependencies and code generation
        run: |
          set -euo pipefail
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          echo "✅ Dependencies and codegen completed"
      - name: Build Android APK
        id: build
        uses: ./.github/actions/build-android-apk
        with:
          version-name: ${{ needs.version_info.outputs.version_name }}
          version-code: ${{ needs.version_info.outputs.version_code }}
          environment: ${{ inputs.environment }}
          target: ${{ inputs.target }}
          flavor: ${{ inputs.flavor }}
          enable-obfuscate: ${{ inputs.enable_obfuscate }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ANDROID_STORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Upload to S3 and generate latest.json
        id: upload_s3
        uses: ./.github/actions/upload-to-s3
        with:
          apk-path: ${{ steps.build.outputs.apk_path }}
          apk-name: ${{ steps.build.outputs.apk_name }}
          version-name: ${{ needs.version_info.outputs.version_name }}
          version-code: ${{ needs.version_info.outputs.version_code }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-prefix: ${{ inputs.s3_prefix }}
          s3-download-url: ${{ vars.S3_DOWNLOAD_URL }}
          changelog-zh: ${{ needs.version_info.outputs.changelog_zh }}
          changelog-en: ${{ needs.version_info.outputs.changelog_en }}
          min-version: ${{ vars.MIN_VERSION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.S3_REGION }}
          environment: ${{ inputs.environment }}
      - name: Upload to Qiniu and generate latest.json
        id: upload_qiniu
        uses: ./.github/actions/upload-to-qiniu
        with:
          apk-path: ${{ steps.build.outputs.apk_path }}
          apk-name: ${{ steps.build.outputs.apk_name }}
          version-name: ${{ needs.version_info.outputs.version_name }}
          version-code: ${{ needs.version_info.outputs.version_code }}
          qiniu-bucket: ${{ vars.QINIU_BUCKET }}
          qiniu-prefix: ${{ inputs.qiniu_prefix }}
          qiniu-download-url: ${{ vars.QINIU_DOWNLOAD_URL }}
          changelog-zh: ${{ needs.version_info.outputs.changelog_zh }}
          changelog-en: ${{ needs.version_info.outputs.changelog_en }}
          min-version: ${{ vars.MIN_VERSION }}
          qiniu-access-key: ${{ secrets.QINIU_ACCESS_KEY }}
          qiniu-secret-key: ${{ secrets.QINIU_SECRET_KEY }}
          qiniu-zone: ${{ vars.QINIU_ZONE }}
          environment: ${{ inputs.environment }}

      - name: Notify Feishu on success
        if: success()
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          curl -X POST https://front-feishu-bot.vercel.app/api/app-update \
            -H "Content-Type: application/json" \
            -d "{\"version_name\": \"$ENVIRONMENT\"}"

  # ====================================
  # ====================================
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: version_info
    if: inputs.enable_ios_build
    outputs:
      ipa_name: ${{ steps.build.outputs.ipa_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
      - name: Setup Flutter build environment
        uses: ./.github/actions/setup-flutter-build
        with:
          version-name: ${{ needs.version_info.outputs.version_name }}
          version-code: ${{ needs.version_info.outputs.version_code }}
          base-api-url: ${{ vars.API_URL_PROD }}
          base-ws-url: ${{ vars.WS_URL_PROD }}
          base-cdn-url: ${{ vars.CDN_URL_PROD }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          candlestick-url: ${{ vars.CANDLESTICK_URL }}
          base-test-api-url: ${{ vars.API_URL_TEST }}
          base-test-ws-url: ${{ vars.WS_URL_TEST }}
      - name: Install dependencies and code generation
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Build iOS IPA
        id: build
        uses: ./.github/actions/build-ios-ipa
        with:
          version-name: ${{ needs.version_info.outputs.version_name }}
          version-code: ${{ needs.version_info.outputs.version_code }}
          environment: ${{ inputs.environment }}
          target: ${{ inputs.target }}
          enable-obfuscate: ${{ inputs.enable_obfuscate }}

  # ====================================
  # Job 4: GitHub Release
  # ====================================
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version_info, build_android]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      release_url: ${{ steps.release.outputs.url }}

    steps:
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ inputs.environment == 'production' && 'Release' || 'Test' }} v${{ needs.version_info.outputs.version_name }}
          tag_name: v${{ needs.version_info.outputs.version_name }}${{ inputs.release_suffix }}
          body: |
            ${{ needs.version_info.outputs.changelog_zh }}

            #### 🇬🇧 English Description
            ${{ needs.version_info.outputs.changelog_en }}

            ---

            ### 📱 Android APK
            **：**
            - ****: `${{ needs.version_info.outputs.version_name }}`
            - ****: `${{ needs.version_info.outputs.version_code }}`
            - ****: `${{ inputs.environment }}`
            - ****: `${{ needs.build_android.outputs.apk_name }}`
            - **SHA‑256**: `${{ needs.build_android.outputs.s3_apk_sha || needs.build_android.outputs.qiniu_apk_sha }}`

            **：**
            - **Flutter**: ${{ env.FLUTTER_VERSION }}
            - **Java**: ${{ env.JAVA_VERSION }}
            - ****: #${{ github.run_number }}
            - ** SHA**: `${{ github.sha }}`

            **S3：**
            - [${{ needs.build_android.outputs.apk_name }}](${{ needs.build_android.outputs.s3_apk_url }})
            - [latest.json](${{ needs.build_android.outputs.s3_latest_json_url }})
            - [${{ needs.build_android.outputs.apk_name }}.sha256](${{ needs.build_android.outputs.s3_sha256_url }})
            - SHA‑256: `${{ needs.build_android.outputs.s3_apk_sha }}`

            **：**
            - [${{ needs.build_android.outputs.apk_name }}](${{ needs.build_android.outputs.qiniu_apk_url }})
            - [latest.json](${{ needs.build_android.outputs.qiniu_latest_json_url }})
            - [${{ needs.build_android.outputs.apk_name }}.sha256](${{ needs.build_android.outputs.qiniu_sha256_url }})
            - SHA‑256: `${{ needs.build_android.outputs.qiniu_apk_sha }}`

          draft: false
          prerelease: ${{ inputs.environment != 'production' }}
