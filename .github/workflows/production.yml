name: Production Environment Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如：1.0.0）"
        required: true
        default: "1.0.0"
      upload_provider:
        description: "上传服务商 (s3/qiniu)"
        required: false
        default: "s3"
        type: choice
        options:
          - s3
          - qiniu

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Production
    uses: ./.github/workflows/_build-and-release.yml
    with:
      environment: production
      version: ${{ github.event.inputs.version || '' }}
      dart_define_env: production
      flavor: production
      enable_obfuscate: true
      s3_prefix: ${{ vars.UPLOAD_PREFIX }}
      qiniu_prefix: ${{ vars.UPLOAD_PREFIX }}
      release_suffix: ""
      enable_ios_build: false
    secrets: inherit
