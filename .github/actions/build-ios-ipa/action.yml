name: "Build iOS IPA"
description: "Build iOS IPA with configurable options"

inputs:
  version-name:
    description: "Version name"
    required: true
  version-code:
    description: "Version code"
    required: true
  environment:
    description: "Environment (staging/production)"
    required: true
  dart-define-env:
    description: "Dart define ENV value"
    required: true
  enable-obfuscate:
    description: "Enable obfuscation"
    required: false
    default: 'false'

outputs:
  ipa_name:
    description: "IPA filename"
    value: ${{ steps.rename.outputs.ipa_name }}

runs:
  using: 'composite'
  steps:
    - name: Build IPA
      shell: bash
      run: |
        BUILD_ARGS="--release --dart-define=ENV=${{ inputs.dart-define-env }} --no-codesign"
        
        if [ "${{ inputs.enable-obfuscate }}" = "true" ]; then
          BUILD_ARGS="$BUILD_ARGS --obfuscate --split-debug-info=build/flutter_symbols/ios"
        fi
        
        flutter build ipa $BUILD_ARGS
        echo "✅ IPA built successfully"

    - name: Rename IPA
      id: rename
      shell: bash
      env:
        APP_NAME: "aigun"
        ENV_SUFFIX: ${{ inputs.environment == 'production' && '' || '-test' }}
      run: |
        cd build/ios/ipa/
        
        if [ -f "Runner.ipa" ]; then
          NEW_NAME="${APP_NAME}-v${{ inputs.version-name }}-${{ inputs.version-code }}${ENV_SUFFIX}.ipa"
          mv Runner.ipa "$NEW_NAME"
          echo "✅ Renamed IPA to: $NEW_NAME"
          echo "ipa_name=$NEW_NAME" >> $GITHUB_OUTPUT
        else
          echo "❌ Runner.ipa not found"
          exit 1
        fi

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        rm -rf ios/Flutter/Flutter.framework ios/Flutter/Flutter.podspec || true
        echo "✅ iOS cleanup completed"