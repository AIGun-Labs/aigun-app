name: "Build Android APK"
description: "Build and sign Android APK with configurable options"

inputs:
  version-name:
    description: "Version name"
    required: true
  version-code:
    description: "Version code"
    required: true
  environment:
    description: "Environment (staging/production)"
    required: true
  dart-define-env:
    description: "Dart define ENV value"
    required: true
  flavor:
    description: "Build flavor"
    required: true
  enable-obfuscate:
    description: "Enable obfuscation"
    required: false
    default: 'false'
  keystore-base64:
    description: "Base64 encoded keystore"
    required: true
  store-password:
    description: "Keystore password"
    required: true
  key-password:
    description: "Key password"
    required: true
  key-alias:
    description: "Key alias"
    required: true

outputs:
  apk_name:
    description: "APK filename"
    value: ${{ steps.rename.outputs.apk_name }}
  apk_path:
    description: "APK file path"
    value: ${{ steps.rename.outputs.apk_path }}

runs:
  using: 'composite'
  steps:
  # 解码 keystore
    - name: Decode keystore
      shell: bash
      run: |
        echo "${{ inputs.keystore-base64 }}" | base64 --decode > android/release.jks
        
        # 验证 keystore
        if [ ! -f "android/release.jks" ] || [ ! -s "android/release.jks" ]; then
          echo "❌ Keystore file is missing or empty"
          exit 1
        fi
        
        cat > android/key.properties << EOF
        storePassword=${{ inputs.store-password }}
        keyPassword=${{ inputs.key-password }}
        keyAlias=${{ inputs.key-alias }}
        storeFile=../release.jks
        EOF
        
        echo "✅ Keystore configured"

    # 构建 APK
    - name: Build APK
      shell: bash
      run: |
        BUILD_ARGS="--release --dart-define=ENV=${{ inputs.dart-define-env }} --flavor ${{ inputs.flavor }}"
        
        if [ "${{ inputs.enable-obfuscate }}" = "true" ]; then
          BUILD_ARGS="$BUILD_ARGS --obfuscate --split-debug-info=build/flutter_symbols/android"
        fi
        
        flutter build apk $BUILD_ARGS
        echo "✅ APK built successfully"

    # 重命名 APK
    - name: Rename APK
      id: rename
      shell: bash
      env:
        APP_NAME: "aigun"
        ENV_SUFFIX: ${{ inputs.environment == 'production' && '' || '-test' }}
      run: |
        cd build/app/outputs/flutter-apk/
        
        SOURCE_FILE="app-${{ inputs.flavor }}-release.apk"
        TARGET_FILE="${APP_NAME}-v${{ inputs.version-name }}-${{ inputs.version-code }}${ENV_SUFFIX}.apk"
        
        if [ -f "$SOURCE_FILE" ]; then
          mv "$SOURCE_FILE" "$TARGET_FILE"
          echo "✅ Renamed: $TARGET_FILE"
          echo "apk_name=$TARGET_FILE" >> $GITHUB_OUTPUT
          echo "apk_path=build/app/outputs/flutter-apk/$TARGET_FILE" >> $GITHUB_OUTPUT
        else
          echo "❌ Source APK not found: $SOURCE_FILE"
          exit 1
        fi

    # 清理
    - name: Cleanup
      if: always()
      shell: bash
      run: |
        rm -f android/release.jks android/key.properties
        echo "✅ Cleanup completed"