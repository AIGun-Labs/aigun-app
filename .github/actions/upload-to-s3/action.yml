name: "Upload to S3"
description: "Upload APK, checksums, and latest.json to S3"

inputs:
  apk-name:
    description: "APK filename"
    required: true
  version-name:
    description: "Version name"
    required: true
  version-code:
    description: "Version code"
    required: true
  s3-bucket:
    description: "S3 bucket name"
    required: true
  s3-prefix:
    description: "S3 prefix path"
    required: true
  cdn-url:
    description: "CDN base URL"
    required: true
  changelog-zh:
    description: "Chinese changelog"
    required: true
  changelog-en:
    description: "English changelog"
    required: true
  min-version:
    description: "Minimum required version"
    required: false
  aws-access-key-id:
    description: "AWS access key ID"
    required: true
  aws-secret-access-key:
    description: "AWS secret access key"
    required: true
  aws-region:
    description: "AWS region"
    required: true
  environment:
    description: "Environment (staging/production)"
    required: true

outputs:
  apk_url:
    description: "APK download URL"
    value: ${{ steps.upload_files.outputs.apk_url }}
  sha256_url:
    description: "SHA256 file URL"
    value: ${{ steps.upload_files.outputs.sha256_url }}
  latest_json_url:
    description: "latest.json URL"
    value: ${{ steps.upload_json.outputs.latest_json_url }}
  apk_sha:
    description: "APK SHA256 hash"
    value: ${{ steps.checksum.outputs.apk_sha }}

runs:
  using: 'composite'
  steps:
    - name: Generate checksums
      id: checksum
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        
        APK_FILE=$(find artifacts -name "${{ inputs.apk-name }}" -type f | head -n 1)
        
        if [ -z "$APK_FILE" ]; then
          echo "❌ APK file not found: ${{ inputs.apk-name }}"
          exit 1
        fi
        
        echo "✅ Found APK at: $APK_FILE"
        
        APK_SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
        echo -n "$APK_SHA" > "dist/${{ inputs.apk-name }}.sha256"
        
        # 复制 APK 到 dist
        cp "$APK_FILE" "dist/${{ inputs.apk-name }}"
        
        echo "apk_sha=$APK_SHA" >> $GITHUB_OUTPUT
        echo "✅ SHA-256: $APK_SHA"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Upload files to S3
      id: upload_files
      shell: bash
      env:
        APP_NAME: "aigun"
      run: |
        set -euo pipefail
        
        KEY_BASE="${{ inputs.s3-prefix }}/${APP_NAME}-v${{ inputs.version-name }}"
        APK_KEY="$KEY_BASE/${{ inputs.apk-name }}"
        SHA_KEY="$KEY_BASE/${{ inputs.apk-name }}.sha256"
        
        echo "📤 Uploading to S3..."
        
        # 上传 APK
        aws s3 cp "dist/${{ inputs.apk-name }}" "s3://${{ inputs.s3-bucket }}/$APK_KEY" \
          --content-type "application/vnd.android.package-archive" 
          --metadata "app=${APP_NAME},version=${{ inputs.version-name }},build=${{ inputs.version-code }},environment=${{ inputs.environment }}"
        
        # 上传校验文件
        aws s3 cp "dist/${{ inputs.apk-name }}.sha256" "s3://${{ inputs.s3-bucket }}/$SHA_KEY" \
          --content-type "text/plain" 
        
        APK_URL="${{ inputs.cdn-url }}/${APK_KEY}"
        SHA_URL="${{ inputs.cdn-url }}/${SHA_KEY}"
        
        echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
        echo "sha256_url=$SHA_URL" >> $GITHUB_OUTPUT
        
        echo "✅ Files uploaded"
        echo "  APK: $APK_URL"
        echo "  SHA: $SHA_URL"

    - name: Generate latest.json
      shell: bash
      env:
        APP_NAME: "aigun"
      run: |
        set -euo pipefail
        
        APK_FILE="dist/${{ inputs.apk-name }}"
        SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
        export SIZE
        export APP="${APP_NAME}"
        export VERSION="${{ inputs.version-name }}"
        export BUILD="${{ inputs.version-code }}"
        export APK_NAME="${{ inputs.apk-name }}"
        export URL="${{ steps.upload_files.outputs.apk_url }}"
        export SHA256="${{ steps.checksum.outputs.apk_sha }}"
        export NOTES_ZH="${{ inputs.changelog-zh }}"
        export NOTES_EN="${{ inputs.changelog-en }}"
        export MIN_VERSION="${{ inputs.min-version }}"
        
        python3 - <<'PY' > dist/latest.json
        import json, os, time

        def process_notes(notes_text):
            notes = []
            for line in (notes_text or "").strip().splitlines():
                line = line.strip()
                if not line:
                    continue
                if line.startswith(('- ', '* ', '+ ')):
                    line = line[2:].strip()
                elif line.startswith(('-', '*', '+')):
                    line = line[1:].strip()
                notes.append(line)
            return notes

        payload = {
          "app": os.environ.get("APP"),
          "latest": os.environ.get("VERSION"),
          "build": int(os.environ.get("BUILD", "0")),
          "min_version": os.environ.get("MIN_VERSION") or None,
          "url": os.environ.get("URL"),
          "sha256": os.environ.get("SHA256"),
          "size": int(os.environ.get("SIZE", "0")),
          "filename": os.environ.get("APK_NAME"),
          "notes": process_notes(os.environ.get("NOTES_ZH")),
          "multilingual_notes": {
            "zh": process_notes(os.environ.get("NOTES_ZH")),
            "en": process_notes(os.environ.get("NOTES_EN")),
          },
          "force": False,
          "published_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        }
        print(json.dumps(payload, ensure_ascii=False, indent=2))
        PY
        
        echo "✅ latest.json generated"
        cat dist/latest.json

    - name: Upload latest.json to S3
      id: upload_json
      shell: bash
      env:
        APP_NAME: "aigun"
      run: |
        set -euo pipefail
        
        # 主路径
        JSON_KEY="${{ inputs.s3-prefix }}/latest.json"
        
        # 兼容旧路径
        OLD_JSON_KEY="${{ inputs.s3-prefix }}/${APP_NAME}/latest.json"
        
        echo "📤 Uploading latest.json..."
        
        # 上传到旧路径（兼容性）
        aws s3 cp dist/latest.json "s3://${{ inputs.s3-bucket }}/$OLD_JSON_KEY" \
          --content-type "application/json" 
        
        # 上传到新路径（主要）
        aws s3 cp dist/latest.json "s3://${{ inputs.s3-bucket }}/$JSON_KEY" \
          --content-type "application/json" 
        
        JSON_URL="${{ inputs.cdn-url }}/${JSON_KEY}"
        
        echo "latest_json_url=$JSON_URL" >> $GITHUB_OUTPUT
        
        echo "✅ latest.json uploaded"
        echo "  Main: $JSON_URL"
        echo "  Legacy: ${{ inputs.cdn-url }}/${OLD_JSON_KEY}"
        
        # 保存到 artifacts
        mkdir -p artifacts/release
        cp dist/latest.json artifacts/release/
        cp dist/*.sha256 artifacts/release/