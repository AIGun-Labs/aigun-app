name: "Upload to Qiniu"
description: "Upload APK, checksums, and latest.json to Qiniu Cloud"

inputs:
  apk-path:
    description: "Full path to APK file"
    required: true
  apk-name:
    description: "APK filename"
    required: true
  version-name:
    description: "Version name"
    required: true
  version-code:
    description: "Version code"
    required: true
  qiniu-bucket:
    description: "Qiniu bucket name"
    required: true
  qiniu-prefix:
    description: "Qiniu key prefix (path)"
    required: true
  qiniu-zone:
    description: "Qiniu zone (z0/z1/z2/na0/as0). Optional"
    required: false
    default: ""
  qiniu-download-url:
    description: "Qiniu download URL"
    required: true
  changelog-zh:
    description: "Chinese changelog"
    required: true
  changelog-en:
    description: "English changelog"
    required: true
  min-version:
    description: "Minimum required version"
    required: false
  qiniu-access-key:
    description: "Qiniu AccessKey"
    required: true
  qiniu-secret-key:
    description: "Qiniu SecretKey"
    required: true
  environment:
    description: "Environment (staging/production)"
    required: true

outputs:
  apk_url:
    description: "APK download URL"
    value: ${{ steps.upload_files.outputs.apk_url }}
  sha256_url:
    description: "SHA256 file URL"
    value: ${{ steps.upload_files.outputs.sha256_url }}
  latest_json_url:
    description: "latest.json URL"
    value: ${{ steps.upload_json.outputs.latest_json_url }}
  apk_sha:
    description: "APK SHA256 hash"
    value: ${{ steps.checksum.outputs.apk_sha }}

runs:
  using: "composite"
  steps:
    - name: Generate checksums
      id: checksum
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        APK_FILE=${{ inputs.apk-path }}
        if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
          echo "❌ APK file not found: ${{ inputs.apk-name }}"
          exit 1
        fi
        APK_SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
        echo -n "$APK_SHA" > "dist/${{ inputs.apk-name }}.sha256"
        cp "$APK_FILE" "dist/${{ inputs.apk-name }}"
        echo "apk_sha=$APK_SHA" >> $GITHUB_OUTPUT

    - name: Install qshell
      shell: bash
      run: |
        set -euo pipefail
        QSHELL_VERSION="2.14.0"
        curl -fsSL -o qshell.tgz "https://github.com/qiniu/qshell/releases/download/v${QSHELL_VERSION}/qshell-v${QSHELL_VERSION}-linux-amd64.tar.gz"
        tar -xzf qshell.tgz
        sudo mv qshell /usr/local/bin/qshell
        qshell version

    - name: Qiniu account login
      shell: bash
      env:
        QINIU_ACCESS_KEY: ${{ inputs.qiniu-access-key }}
        QINIU_SECRET_KEY: ${{ inputs.qiniu-secret-key }}
      run: |
        set -euo pipefail
        qshell account "$QINIU_ACCESS_KEY" "$QINIU_SECRET_KEY" owner
        qshell user

    - name: Upload APK and SHA256 to Qiniu
      id: upload_files
      shell: bash
      env:
        APP_NAME: "aigun"
      run: |
        set -euo pipefail
        KEY_BASE="${{ inputs.qiniu-prefix }}/${APP_NAME}-v${{ inputs.version-name }}"
        APK_KEY="${KEY_BASE}/${{ inputs.apk-name }}"
        SHA_KEY="${KEY_BASE}/${{ inputs.apk-name }}.sha256"

        qshell rput "${{ inputs.qiniu-bucket }}" "$APK_KEY" "dist/${{ inputs.apk-name }}"
        qshell rput "${{ inputs.qiniu-bucket }}" "$SHA_KEY" "dist/${{ inputs.apk-name }}.sha256"
        APK_URL="${{ inputs.qiniu-download-url }}/${APK_KEY}"
        SHA_URL="${{ inputs.qiniu-download-url }}/${SHA_KEY}"
        echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
        echo "sha256_url=$SHA_URL" >> $GITHUB_OUTPUT

    - name: Generate latest.json
      shell: bash
      env:
        APP_NAME: "aigun"
      run: |
        set -euo pipefail
        APK_FILE="dist/${{ inputs.apk-name }}"
        SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
        export SIZE
        export APP="${APP_NAME}"
        export VERSION="${{ inputs.version-name }}"
        export BUILD="${{ inputs.version-code }}"
        export APK_NAME="${{ inputs.apk-name }}"
        export URL="${{ steps.upload_files.outputs.apk_url }}"
        export SHA256="${{ steps.checksum.outputs.apk_sha }}"
        export NOTES_ZH="${{ inputs.changelog-zh }}"
        export NOTES_EN="${{ inputs.changelog-en }}"
        export MIN_VERSION="${{ inputs.min-version }}"
        python3 - <<'PY' > dist/latest.json
        import json, os, time
        def process_notes(notes_text):
            notes = []
            for line in (notes_text or "").strip().splitlines():
                line = line.strip()
                if not line:
                    continue
                if line.startswith(('- ', '* ', '+ ')):
                    line = line[2:].strip()
                elif line.startswith(('-', '*', '+')):
                    line = line[1:].strip()
                notes.append(line)
            return notes
        payload = {
          "app": os.environ.get("APP"),
          "latest": os.environ.get("VERSION"),
          "build": int(os.environ.get("BUILD", "0")),
          "min_version": os.environ.get("MIN_VERSION") or None,
          "url": os.environ.get("URL"),
          "sha256": os.environ.get("SHA256"),
          "size": int(os.environ.get("SIZE", "0")),
          "filename": os.environ.get("APK_NAME"),
          "notes": process_notes(os.environ.get("NOTES_ZH")),
          "multilingual_notes": {
            "zh": process_notes(os.environ.get("NOTES_ZH")),
            "en": process_notes(os.environ.get("NOTES_EN")),
          },
          "force": False,
          "published_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        }
        print(json.dumps(payload, ensure_ascii=False, indent=2))
        PY

    - name: Upload latest.json to Qiniu
      id: upload_json
      shell: bash
      run: |
        set -euo pipefail
        JSON_KEY="${{ inputs.qiniu-prefix }}/latest.json"
        qshell rput "${{ inputs.qiniu-bucket }}" "$JSON_KEY" "dist/latest.json" --overwrite
        JSON_URL="${{ inputs.qiniu-download-url }}/${JSON_KEY}"
        echo "latest_json_url=$JSON_URL" >> $GITHUB_OUTPUT